<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Entre em contato com a Companhia de Rafting em Corredeiras para tirar dúvidas sobre passeios, pacotes de aventura e reservas em Maceió.">
    <meta name="author" content="Nome do Aluno">
    <title>Fale Conosco | Companhia de Rafting em Corredeiras</title>
    <link rel="stylesheet" href="estilos/contato.css">
</head>

<body>

    <!-- 1º NAV: DENTRO DO HEADER COM OS 4 LINKS EXATOS -->
    <header class="site-header">
        <div class="header-container">
            <div class="logo-box">
                <img src="imagens/logo-rafting-site.png" alt="Logotipo da Companhia de Rafting">
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Página Inicial</a></li>
                    <li><a href="sobre.html">Sobre Nós</a></li>
                    <li><a href="passeios.html">Passeios</a></li>
                    <li><a href="contato.html" class="active">Fale Conosco</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <!-- SEÇÃO DE INFORMAÇÕES DA EMPRESA -->
        <section class="company-info-section">
            <h1>Companhia de Rafting em Corredeiras</h1>
            <address>
                <p>123 Rua Principal do Rio</p>
                <p>Maceió, Alagoas</p>
                <p><a href="tel:+5582999999999">+55 82 99999-9999</a></p>
                <p><a href="mailto:info@correiras.com">info@correiras.com</a></p>
            </address>
        </section>

        <!-- SEÇÃO MAPA E FORMULÁRIO -->
        <section class="contact-grid-section">
            <div class="map-wrapper">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d125745.31977798993!2d-35.78921822819875!3d-9.622159846059902!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x701458fc1687989%3A0xee2c725d2703649a!2sMacei%C3%B3%2C%20AL!5e0!3m2!1spt-BR!2sbr!4v1710000000000!5m2!1spt-BR!2sbr"
                  title="Localização em Maceió, Alagoas" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <div class="form-wrapper">
                <form action="#" method="post" class="contact-form">

                    <div class="form-group row">
                        <label for="user-name">Nome</label>
                        <input type="text" id="user-name" name="nome" placeholder="Digite aqui"
                          required>
                    </div>

                    <div class="form-group row">
                        <label for="user-email">E-mail</label>
                        <input type="email" id="user-email" name="email" placeholder="Digite aqui"
                          required>
                    </div>

                    <fieldset class="radio-fieldset">
                        <legend>Propósito da Mensagem</legend>
                        <div class="radio-options">
                            <label class="radio-label">
                                <input type="radio" name="proposito" value="consulta_geral" checked>
                                <span>Consulta Geral</span>
                            </label>

                            <label class="radio-label">
                                <input type="radio" name="proposito" value="pergunta_reserva">
                                <span>Pergunta sobre Reserva</span>
                            </label>

                            <label class="radio-label">
                                <input type="radio" name="proposito" value="sugestao_site">
                                <span>Sugestão de Site</span>
                            </label>
                        </div>
                    </fieldset>

                    <div class="form-group column">
                        <label for="user-message">Mensagem</label>
                        <textarea id="user-message" name="mensagem" rows="4"
                          placeholder="Digite aqui" required></textarea>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="newsletter" name="newsletter" value="sim">
                        <label for="newsletter">Quero receber a newsletter mensal</label>
                    </div>

                    <div class="form-group submit-box">
                        <button type="submit" class="btn-submit">Entrar em Contato!</button>
                    </div>

                </form>
            </div>
        </section>

        <!-- SEÇÃO EQUIPE -->
        <section class="team-section">
            <h2>Estamos Aqui para Servi-lo</h2>
            <div class="team-grid">

                <figure class="team-card">
                    <img src="https://placehold.co/150x150?text=Carlos"
                      alt="Foto do perfil de Carlos Silva">
                    <figcaption>
                        <strong>Carlos Silva</strong>
                        <p>Guia Chefe de Rafting</p>
                    </figcaption>
                </figure>

                <figure class="team-card">
                    <img src="https://placehold.co/150x150?text=Marina"
                      alt="Foto do perfil de Marina Santos">
                    <figcaption>
                        <strong>Marina Santos</strong>
                        <p>Gerente de Reservas</p>
                    </figcaption>
                </figure>

                <figure class="team-card">
                    <img src="https://placehold.co/150x150?text=Rodrigo"
                      alt="Foto do perfil de Rodrigo Lima">
                    <figcaption>
                        <strong>Rodrigo Lima</strong>
                        <p>Especialista em Segurança Aquática</p>
                    </figcaption>
                </figure>

            </div>
        </section>
    </main>

    <!-- 2º NAV: DENTRO DO FOOTER COM CLASS 'redes-sociais', 3 LINKS E 3 IMAGENS -->
    <footer class="site-footer">
        <div class="footer-container">
            <p class="footer-text">© 2026, Rafting em Corredeiras, Lucas Bezerra de Lima Santos.</p>

            <nav class="redes-sociais">
                <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                    <img src="https://placehold.co/32x32?text=FB" alt="Ícone do Facebook">
                </a>
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                    <img src="https://placehold.co/32x32?text=IG" alt="Ícone do Instagram">
                </a>
                <a href="https://youtube.com" target="_blank" rel="noopener noreferrer">
                    <img src="https://placehold.co/32x32?text=YT" alt="Ícone do YouTube">
                </a>
            </nav>
        </div>
    </footer>

</body>

</html>
