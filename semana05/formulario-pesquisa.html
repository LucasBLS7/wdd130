<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=h, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>

    </header>

    <main>
        <form action="">
            <label for="nomecompleto">Nome completo: </label>
            <input type="text" id="nome-completo" name="nome-completo" required>
            <label for="emaildousuario">Email:</label>
            <input type="text" id="email-do-usuario" name="email-do-usuario" required>

            <label for="navegadorfavorito">Qual é o seu navegador favorito</label>
            <select id="navegador" name="navegador">
                <option value="1">Chrome</option>
                <option value="2">Safari</option>
                <option value="3">Edge</option>
                <option value="4">Outro</option>
            </select>
            <label for="pet">Você tem um bichinho de estimação em casa</label>
            <input type="checkbox" id="pet" name="pet">
            <label for="feedback">Liste lugares onde você morou: </label>
            <textarea id="feedback" name="feedback" rows="4"
              placeholder="Maceió, São Paulo, Londrina, Apucarana, Sarandi"></textarea>

            <button type="submit">Enviar Pesquisa</button>
        </form>

    </main>

    <footer>

    </footer>

</body>

</html>
